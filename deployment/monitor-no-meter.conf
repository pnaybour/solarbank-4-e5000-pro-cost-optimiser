# Added 28 Oct 2026 by the Solarbank Cost Optimiser project (owner request: no interference between the two applications).
# The smart meter (192.168.1.20) allows ONE Modbus client and the optimiser's controller owns it. This rule makes the kernel drop
# any connection from the energy monitor to the meter, whatever the monitor's own code does. Remove this file to undo.
[Service]
IPAccounting=yes
IPAddressDeny=192.168.1.20
