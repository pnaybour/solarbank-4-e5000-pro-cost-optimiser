[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "solarbank-cost-optimiser"
version = "0.5.37"
description = "Independent Solarbank observation and offline control foundation"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "jinja2==3.1.6", "pvlib==0.16.1", "pymodbus==3.11.3", "transitions==0.9.3", "whisper==1.1.10"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1", "hypothesis==6.170.14"]
dev = ["pyyaml==6.0.3"]   # only for scripts/check-vendor-maps.py

[project.scripts]
solarbank = "solarbank_optimiser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solarbank_optimiser = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

